name             = CDN-Fast-VCL-Dump
author           = Graham Ollis <plicease@cpan.org>
license          = Perl_5
copyright_holder = Graham Ollis
copyright_year   = 2026
version          = 0.01

[@Author::Plicease]
:version       = 2.79
release_tests  = 1
installer      = Author::Plicease::MakeMaker
github_user    = uperl
default_branch = main
test2_v0       = 1
workflow       = static
workflow       = linux
version_plugin = PkgVersion::Block

[Author::Plicease::Core]

[Author::Plicease::Upload]
cpan = 1

[PruneFiles]
filename = xt/author/pod_spelling_common.t

; WebService::Fastly ships these as part of its own distribution; depend on
; the distribution as a whole and keep its internals out of Makefile.PL and
; the t/00_diag.t module report.
[RemovePrereqs]
remove = WebService::Fastly::ApiFactory
remove = WebService::Fastly::Object::BulkUpdateDictionaryItem
remove = WebService::Fastly::Object::BulkUpdateDictionaryListRequest
remove = WebService::Fastly::Object::BulkUpdateAclEntry
remove = WebService::Fastly::Object::BulkUpdateAclEntriesRequest

[Prereqs]
perl                       = 5.042000
WebService::Fastly         = 15.01
YAML::PP                   = 0
Path::Tiny                 = 0.125
TOML::Tiny                 = 0
Getopt::Long::Descriptive  = 0


